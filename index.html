<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Style Calendar</title>
    <style>
        :root {
            /* 浅色模式变量 */
            --bg-color: #fbfbfd;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --accent-color: #007aff;
            --accent-text: #ffffff;
            --holiday-color: #ff3b30; /* Apple Red */
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            --blob-1: rgba(162, 210, 255, 1);
            --blob-2: rgba(205, 180, 219, 1);
            --hover-bg: rgba(0,0,0,0.05);
            --weather-bg: rgba(0, 122, 255, 0.1);
        }

        /* 深色模式变量 */
        [data-theme="dark"] {
            --bg-color: #000000;
            --glass-bg: rgba(28, 28, 30, 0.75);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #f5f5f7;
            --text-secondary: #86868b;
            --accent-color: #0a84ff;
            --accent-text: #ffffff;
            --holiday-color: #ff453a;
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            --blob-1: rgba(10, 132, 255, 0.6);
            --blob-2: rgba(94, 92, 230, 0.6);
            --hover-bg: rgba(255,255,255,0.1);
            --weather-bg: rgba(10, 132, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-color);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 动态背景流光 */
        .background-blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--blob-1) 0%, var(--blob-2) 100%);
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            animation: float 10s infinite ease-in-out alternate;
            opacity: 0.8;
        }
        .blob-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--blob-2) 0%, var(--blob-1) 100%);
            top: 10%;
            left: 20%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(30px, 50px) scale(1.1); }
        }

        /* 主容器 */
        .container {
            width: 400px;
            background: var(--glass-bg);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border-radius: 24px;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            padding: 25px;
            color: var(--text-primary);
            position: relative;
            display: flex;
            flex-direction: column;
        }

        /* 顶部栏 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        /* 按钮样式 */
        .icon-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
        }
        .icon-btn:hover { background: var(--hover-bg); }
        .icon-btn svg { width: 18px; height: 18px; fill: currentColor; }
        
        .icon-hidden { display: none; }

        /* 天气胶囊 */
        .weather-pill {
            font-size: 0.8rem;
            color: var(--accent-color);
            background: var(--weather-bg);
            padding: 4px 12px;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            cursor: pointer;
        }
        
        /* 旋转动画 */
        .spin { animation: spin 1s linear infinite; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* 时间显示 */
        .time-header {
            text-align: center;
            margin-bottom: 20px;
        }
        .clock-huge {
            font-size: 3rem;
            font-weight: 200;
            letter-spacing: -1px;
            margin-bottom: 5px;
            font-variant-numeric: tabular-nums;
        }
        .location-tag {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* 分割线 */
        .divider {
            height: 1px;
            background: var(--text-secondary);
            opacity: 0.1;
            margin: 15px 0;
        }

        /* 日历导航 */
        .calendar-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding: 0 5px;
        }
        .nav-btn {
            background: transparent;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            padding: 5px 10px;
            font-size: 1.2rem;
            border-radius: 8px;
        }
        .nav-btn:hover { background: var(--hover-bg); }

        .current-month-display {
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
        }
        .current-month-display:hover { opacity: 0.7; }
        
        /* 隐形的原生日期选择器，覆盖在文字上方 */
        #month-picker {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .btn-today {
            font-size: 0.8rem;
            color: var(--accent-color);
            cursor: pointer;
            font-weight: 600;
            display: none;
        }
        .btn-today.show { display: block; }

        /* 日历网格 */
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .day-name {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .day-cell {
            height: 46px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 6px;
            border-radius: 10px;
            cursor: default;
            position: relative;
        }

        .day-cell:hover:not(.empty):not(.today) {
            background: var(--hover-bg);
        }

        .day-num {
            font-size: 1rem;
            font-weight: 500;
            line-height: 1.2;
        }

        .holiday-text {
            font-size: 0.6rem;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }

        .is-holiday .holiday-text {
            color: var(--holiday-color);
        }

        .day-cell.today {
            background: var(--accent-color);
            color: white;
            box-shadow: 0 4px 12px rgba(0, 122, 255, 0.4);
        }
        .day-cell.today .holiday-text {
            color: rgba(255,255,255,0.9);
        }
        
        /* 周末灰色 */
        .day-cell.weekend .day-num { color: var(--text-secondary); }
        .day-cell.today.weekend .day-num { color: white; }

    </style>
</head>
<body>

    <div class="background-blob"></div>
    <div class="background-blob blob-2"></div>

    <div class="container">
        <div class="top-bar">
            <div class="weather-pill" id="weather-widget" onclick="initWeather()">
                <span id="weather-icon">
                    <svg class="spin" viewBox="0 0 24 24" width="14" height="14">
                        <path d="M12 4V2A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8z" fill="currentColor"/>
                    </svg>
                </span>
                <span id="weather-text">加载中</span>
            </div>

            <button class="icon-btn" id="theme-btn" aria-label="切换深色模式">
                <svg class="icon-sun" viewBox="0 0 24 24">
                    <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
                </svg>
                <svg class="icon-moon icon-hidden" viewBox="0 0 24 24">
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-3.03 0-5.5-2.47-5.5-5.5 0-1.82.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
                </svg>
            </button>
        </div>

        <div class="time-header">
            <div class="clock-huge" id="clock">00:00:00</div>
            <div class="location-tag">北京时间</div>
        </div>

        <div class="divider"></div>

        <div class="calendar-nav">
            <button class="nav-btn" onclick="changeMonth(-1)">&#8249;</button>
            <div class="current-month-display">
                <span id="display-year-month">Loading...</span>
                <input type="month" id="month-picker">
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <span class="btn-today" id="btn-reset" onclick="resetToToday()">今天</span>
                <button class="nav-btn" onclick="changeMonth(1)">&#8250;</button>
            </div>
        </div>

        <div class="calendar-grid" id="calendar-grid">
            <div class="day-name">日</div>
            <div class="day-name">一</div>
            <div class="day-name">二</div>
            <div class="day-name">三</div>
            <div class="day-name">四</div>
            <div class="day-name">五</div>
            <div class="day-name">六</div>
        </div>
    </div>

    <svg style="display: none;">
        <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"></circle><path d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
        <symbol id="icon-cloud" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></symbol>
        <symbol id="icon-rain" viewBox="0 0 24 24"><path d="M16 13v8m-8-8v8m4-6v8M20 16.58A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.25"></path></symbol>
    </svg>

    <script>
        // --- 配置数据 ---
        let viewDate = new Date(); // 当前视图日期

        // 公历节日
        const solarHolidays = {
            '01-01': '元旦', '02-14': '情人节', '03-08': '妇女节', 
            '05-01': '劳动节', '05-04': '青年节', '06-01': '儿童节', 
            '07-01': '建党节', '08-01': '建军节', '09-10': '教师节', 
            '10-01': '国庆节', '10-24': '程序员节', '12-25': '圣诞节'
        };

        // 农历映射 (2024-2026 主要节日)
        const lunarMapping = {
            '2024-02-09': '除夕', '2024-02-10': '春节', '2024-02-24': '元宵', 
            '2024-04-04': '清明', '2024-06-10': '端午', '2024-09-17': '中秋',
            '2025-01-28': '除夕', '2025-01-29': '春节', '2025-02-12': '元宵', 
            '2025-04-04': '清明', '2025-05-31': '端午', '2025-10-06': '中秋',
            '2026-02-16': '除夕', '2026-02-17': '春节', '2026-06-19': '端午', '2026-09-25': '中秋'
        };

        // --- 1. 日历核心逻辑 ---
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            const displayTitle = document.getElementById('display-year-month');
            const todayBtn = document.getElementById('btn-reset');
            const picker = document.getElementById('month-picker');

            // 清理旧日期 (保留表头)
            while (grid.children.length > 7) grid.removeChild(grid.lastChild);

            const year = viewDate.getFullYear();
            const month = viewDate.getMonth();
            const realToday = new Date();

            // 更新标题
            displayTitle.innerText = `${year}年 ${month + 1}月`;
            picker.value = `${year}-${String(month+1).padStart(2, '0')}`;

            // "今天"按钮显隐
            if (year === realToday.getFullYear() && month === realToday.getMonth()) {
                todayBtn.classList.remove('show');
            } else {
                todayBtn.classList.add('show');
            }

            // 计算日期
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const startDay = new Date(year, month, 1).getDay();

            // 填充前置空白
            for (let i = 0; i < startDay; i++) {
                const empty = document.createElement('div');
                empty.className = 'day-cell empty';
                grid.appendChild(empty);
            }

            // 填充天数
            for (let d = 1; d <= daysInMonth; d++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell';
                
                const dayStr = String(d).padStart(2, '0');
                const monthStr = String(month + 1).padStart(2, '0');
                const fullDateStr = `${year}-${monthStr}-${dayStr}`;
                const solarKey = `${monthStr}-${dayStr}`;

                // 周末样式
                const currentDayOfWeek = new Date(year, month, d).getDay();
                if (currentDayOfWeek === 0 || currentDayOfWeek === 6) {
                    cell.classList.add('weekend');
                }

                // 今天高亮
                if (year === realToday.getFullYear() && month === realToday.getMonth() && d === realToday.getDate()) {
                    cell.classList.add('today');
                }

                // 节日判断
                let holidayName = '';
                let isHoliday = false;

                if (lunarMapping[fullDateStr]) {
                    holidayName = lunarMapping[fullDateStr];
                    isHoliday = true;
                } else if (solarHolidays[solarKey]) {
                    holidayName = solarHolidays[solarKey];
                    isHoliday = true;
                }

                if (isHoliday) cell.classList.add('is-holiday');

                cell.innerHTML = `
                    <div class="day-num">${d}</div>
                    <div class="holiday-text">${holidayName}</div>
                `;
                grid.appendChild(cell);
            }
        }

        // 导航事件
        function changeMonth(offset) {
            viewDate.setMonth(viewDate.getMonth() + offset);
            renderCalendar();
        }

        function resetToToday() {
            viewDate = new Date();
            renderCalendar();
        }

        // 监听原生日期选择器
        document.getElementById('month-picker').addEventListener('input', function(e) {
            if(this.value) {
                const [y, m] = this.value.split('-');
                viewDate = new Date(parseInt(y), parseInt(m) - 1, 1);
                renderCalendar();
            }
        });

        // --- 2. 时钟 ---
        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('zh-CN', { hour12: false });
        }

        // --- 3. 深色模式 ---
        const themeBtn = document.getElementById('theme-btn');
        const html = document.documentElement;

        function toggleTheme() {
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            document.querySelector('.icon-sun').classList.toggle('icon-hidden', !isDark);
            document.querySelector('.icon-moon').classList.toggle('icon-hidden', isDark);
        }

        themeBtn.addEventListener('click', toggleTheme);

        // 初始化读取主题
        if(localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.setAttribute('data-theme', 'dark');
            document.querySelector('.icon-sun').classList.add('icon-hidden');
            document.querySelector('.icon-moon').classList.remove('icon-hidden');
        }

        // --- 4. 天气 (Open-Meteo) ---
        function initWeather() {
            const txt = document.getElementById('weather-text');
            const iconBox = document.getElementById('weather-icon');
            
            txt.innerText = "定位中...";
            iconBox.innerHTML = '<svg class="spin" viewBox="0 0 24 24" width="14" height="14"><path d="M12 4V2A10 10 0 0 0 2 12h2a8 8 0 0 1 8-8z" fill="currentColor"/></svg>';

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    pos => fetchWeather(pos.coords.latitude, pos.coords.longitude),
                    () => fetchWeather(39.9042, 116.4074) // 默认北京
                );
            } else {
                fetchWeather(39.9042, 116.4074);
            }
        }

        async function fetchWeather(lat, lon) {
            try {
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                const data = await res.json();
                const w = data.current_weather;
                
                let icon = '<use href="#icon-cloud"/>';
                if (w.weathercode === 0) icon = '<use href="#icon-sun"/>'; // 晴
                if (w.weathercode > 50) icon = '<use href="#icon-rain"/>'; // 雨/雪

                document.getElementById('weather-icon').innerHTML = `<svg width="14" height="14" fill="currentColor">${icon}</svg>`;
                document.getElementById('weather-text').innerText = `${Math.round(w.temperature)}°C`;
            } catch (e) {
                document.getElementById('weather-text').innerText = "无数据";
            }
        }

        // --- 启动 ---
        setInterval(updateClock, 1000);
        updateClock();
        renderCalendar();
        initWeather();

    </script>
</body>
</html>
